<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кредиты — Odysseus</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4L16 22L6 22Z' fill='%23e06c75'/%3E%3Cpath d='M16 8L16 22L24 22Z' fill='%23e06c75' opacity='0.6'/%3E%3Cpath d='M4 24Q10 20 16 24Q22 28 28 24' stroke='%23e06c75' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- Apply saved theme immediately to avoid flash -->
  <script nonce="{{CSP_NONCE}}">
  (function(){
    try {
      var t = JSON.parse(localStorage.getItem('odysseus-theme'));
      if (t && t.colors) {
        var s = document.documentElement.style;
        var c = t.colors;
        s.setProperty('--bg', c.bg);
        s.setProperty('--fg', c.fg);
        s.setProperty('--panel', c.panel);
        s.setProperty('--border', c.border);
        if (c.red) s.setProperty('--red', c.red);
        if (c.advanced && c.advanced.brandColor) s.setProperty('--brand-color', c.advanced.brandColor);
        var ac = c.red || '#e06c75';
        var fav = document.querySelector("link[rel='icon']");
        if (fav) fav.href = 'data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 4L16 22L6 22Z' fill='" + ac + "'/><path d='M16 8L16 22L24 22Z' fill='" + ac + "' opacity='0.6'/><path d='M4 24Q10 20 16 24Q22 28 28 24' stroke='" + ac + "' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>");
        if (t.font) {
          var fm = {mono:"'Fira Code', monospace", sans:"system-ui, -apple-system, 'Segoe UI', sans-serif", serif:"Georgia, 'Times New Roman', serif"};
          s.setProperty('--font-family', fm[t.font] || ("'" + t.font.replace(/'/g,'') + "', 'Inter', sans-serif"));
        }
      }
    } catch(e){}
  })();
  </script>
  <!-- Inter font — same as main app -->
  <style>
    @font-face { font-family: 'Inter'; font-weight: 400; font-style: normal; font-display: swap; src: url('/static/fonts/Inter-Regular.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 500; font-style: normal; font-display: swap; src: url('/static/fonts/Inter-Medium.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 600; font-style: normal; font-display: swap; src: url('/static/fonts/Inter-SemiBold.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 700; font-style: normal; font-display: swap; src: url('/static/fonts/Inter-Regular.woff2') format('woff2'); }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #282c34;
      --fg:     #9cdef2;
      --panel:  #111;
      --border: #355a66;
      --red:    #e06c75;
      --green:  #50fa7b;
      --warn:   #f0ad4e;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 80px;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Page header ── */
    .page-header {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      opacity: 0.55;
      font-size: 12px;
      font-family: inherit;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .back-btn:hover { opacity: 0.9; border-color: var(--fg); }

    .page-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--fg);
    }

    /* ── Cards ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--fg);
      opacity: 0.4;
      margin-bottom: 16px;
    }

    /* ── User row ── */
    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--red) 18%, transparent);
      border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--red);
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .user-name  { font-size: 14px; font-weight: 600; color: var(--fg); line-height: 1.3; }
    .user-role  { font-size: 12px; color: var(--fg); opacity: 0.45; margin-top: 1px; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    /* ── Stats grid ── */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: color-mix(in srgb, var(--fg) 4%, transparent);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat-label {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--fg);
      opacity: 0.38;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .stat-value.dim    { color: var(--fg); opacity: 0.5; font-size: 20px; }
    .stat-value.green  { color: var(--green); }
    .stat-value.yellow { color: var(--warn); }
    .stat-value.red    { color: var(--red); }

    /* ── Progress bar ── */
    .progress-wrap { margin-bottom: 8px; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 7px;
      font-size: 12px;
      color: var(--fg);
      opacity: 0.55;
    }
    .progress-pct { font-weight: 700; opacity: 1; }

    .progress-track {
      height: 6px;
      background: color-mix(in srgb, var(--fg) 8%, transparent);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    .progress-fill.green  { background: var(--green); }
    .progress-fill.yellow { background: var(--warn); }
    .progress-fill.red    { background: var(--red); }

    .progress-hint {
      font-size: 11px;
      color: var(--fg);
      opacity: 0.35;
      margin-top: 5px;
    }

    /* ── Reset row ── */
    .reset-row {
      display: flex;
      align-items: center;
      gap: 7px;
      background: color-mix(in srgb, var(--fg) 4%, transparent);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 13px;
      font-size: 12px;
      color: var(--fg);
      opacity: 0.6;
    }
    .reset-row svg { flex-shrink: 0; }
    .reset-row strong { color: var(--fg); opacity: 1; font-weight: 600; }

    /* ── Unlimited ── */
    .unlimited-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: color-mix(in srgb, var(--green) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--green) 28%, transparent);
      color: var(--green);
      border-radius: 99px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* ── Info card ── */
    .info-card {
      font-size: 13px;
      color: var(--fg);
      opacity: 0.5;
      line-height: 1.65;
    }
    .info-card em { font-style: normal; font-weight: 600; opacity: 1; color: var(--fg); }

    /* ── Loading / Error ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 56px 0;
      color: var(--fg);
      opacity: 0.4;
      font-size: 13px;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 2px solid color-mix(in srgb, var(--fg) 15%, transparent);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      text-align: center;
      padding: 48px 0;
      color: var(--red);
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="page-header">
  <a href="/" class="back-btn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Назад
  </a>
  <div class="page-title">Кредиты</div>
</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    Загрузка…
  </div>
</div>

<script nonce="{{CSP_NONCE}}">
(async () => {
  const root = document.getElementById('content');

  let data;
  try {
    const res = await fetch('/api/auth/usage', { credentials: 'same-origin' });
    if (res.status === 401) { window.location.replace('/'); return; }
    if (!res.ok) throw new Error('Ошибка сервера ' + res.status);
    data = await res.json();
  } catch (e) {
    root.innerHTML = `<div class="error-msg">Не удалось загрузить данные.<br><small style="opacity:0.6">${e.message}</small></div>`;
    return;
  }

  const { username, is_admin, limit, used, remaining, reset_at } = data;

  function fmtReset(iso) {
    if (!iso) return null;
    const diff = new Date(iso) - Date.now();
    if (diff <= 0) return 'скоро';
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    return h > 0 ? `через ${h} ч ${m} мин` : `через ${m} мин`;
  }

  function col(pct) {
    if (pct >= 90) return 'red';
    if (pct >= 65) return 'yellow';
    return 'green';
  }

  const initial = (username || '?')[0].toUpperCase();
  const roleLabel = is_admin ? 'Администратор' : 'Пользователь';

  let statsHTML = '';
  let progressHTML = '';
  let resetHTML = '';

  if (is_admin || limit === null) {
    statsHTML = `
      <div class="unlimited-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/></svg>
        Без ограничений
      </div>
      <div class="info-card">Ваш аккаунт имеет неограниченное количество сообщений в день.</div>
    `;
  } else {
    const pct = limit > 0 ? Math.min(100, Math.round((used / limit) * 100)) : 0;
    const c = col(pct);
    const resetStr = fmtReset(reset_at);

    statsHTML = `
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-label">Лимит</div>
          <div class="stat-value dim">${limit}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Использовано</div>
          <div class="stat-value ${c}">${used}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Осталось</div>
          <div class="stat-value ${remaining === 0 ? 'red' : 'green'}">${remaining}</div>
        </div>
      </div>
    `;

    progressHTML = `
      <div class="progress-wrap">
        <div class="progress-header">
          <span>Использование за сутки</span>
          <span class="progress-pct ${c}">${pct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill ${c}" id="pbar" style="width:0%"></div>
        </div>
        <div class="progress-hint">${used} из ${limit} сообщений за последние 24 часа</div>
      </div>
    `;

    resetHTML = `
      <div class="divider"></div>
      <div class="reset-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        ${resetStr
          ? `Лимит обновится <strong>${resetStr}</strong> — отсчёт идёт от первого сообщения`
          : `Лимит обновляется через <strong>24 часа</strong> после первого сообщения дня`}
      </div>
    `;

    // Animate bar after render
    setTimeout(() => {
      const bar = document.getElementById('pbar');
      if (bar) bar.style.width = pct + '%';
    }, 60);
  }

  root.innerHTML = `
    <div class="card">
      <div class="card-title">Аккаунт</div>
      <div class="user-row">
        <div class="avatar">${initial}</div>
        <div>
          <div class="user-name">${username}</div>
          <div class="user-role">${roleLabel}</div>
        </div>
      </div>
      <div class="divider"></div>
      ${statsHTML}
      ${progressHTML}
      ${resetHTML}
    </div>

    <div class="card">
      <div class="card-title">Как работает лимит</div>
      <div class="info-card">
        Каждое отправленное сообщение засчитывается в лимит на 24 часа. Лимит обновляется скользящим окном —
        не в полночь, а через 24 часа после <em>первого</em> сообщения дня. Администратор может изменить лимит для вашего аккаунта.
      </div>
    </div>
  `;
})();
</script>

</body>
</html>
